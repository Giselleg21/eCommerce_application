{% extends 'Shop/base.html' %}

{% block header %}
    Add New Store
{% endblock header %}

{% block content %}
    <form method="POST">
        {% csrf_token %}

        <label for="name">Store Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>

        <br><br>

        <button type="submit" class="btn-secondary">Create Store</button>
    </form>

    <a href="{% url 'store_list' %}">Back to Stores</a>
{% endblock content %}
