{% extends 'Shop/base.html' %}

{% block content %}
    <h1>Delete Product</h1>

    <p>Are you sure you want to delete "{{ product.name }}"?</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn-secondary" style="padding:10px">Yes, Delete</button>
    </form>

    <a href="{% url 'product_detail' product.id %}">Cancel</a>
{% endblock content %}
